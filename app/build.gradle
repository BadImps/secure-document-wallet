plugins { id 'com.android.application' }

android {
    namespace 'com.secure.documentwallet'
    compileSdk 36
    signingConfigs {
        // Existing installs through 3.12 use this certificate.  Keep it so 3.13
        // remains an Android-compatible OTA update rather than a separate app.
        legacyOta {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    defaultConfig {
        applicationId 'com.secure.documentwallet'
        minSdk 26
        targetSdk 36
        versionCode 34
        versionName '3.13'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.includeAndroidResources = true }
    buildTypes {
        release {
            signingConfig signingConfigs.legacyOta
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'org.json:json:20240303'
}
